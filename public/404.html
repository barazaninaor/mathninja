<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Math Ninja</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // This script takes the current URL and redirects it to the index.html page
      var pathSegmentsToKeep = 1; // 1 keeps the repo name (/mathninja/)

      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname
            .split("/")
            .slice(0, 1 + pathSegmentsToKeep)
            .join("/") +
          "/?p=/" +
          l.pathname.slice(1).split("/").slice(pathSegmentsToKeep).join("/") +
          (l.search ? "&q=" + l.search.slice(1) : "") +
          l.hash,
      );
    </script>
  </head>
  <body></body>
</html>
